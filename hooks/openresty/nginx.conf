pcre_jit on;
error_log /dev/stderr notice;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    lua_package_path "/usr/local/openresty/lualib/ipxa/?.lua;;";
    lua_package_cpath ";;";

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'id=$request_id';

    access_log /dev/stdout main;
    error_log  /dev/stderr;

    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path       /var/run/openresty/nginx-proxy;
    fastcgi_temp_path     /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path       /var/run/openresty/nginx-uwsgi;
    scgi_temp_path        /var/run/openresty/nginx-scgi;

    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    lua_shared_dict ip_cache 10m;

    server {
        listen 80 default_server;
        server_name _;

        set_real_ip_from  0.0.0.0/0;
        real_ip_header    X-Forwarded-For;

        error_page 400 401 403 404 405 500 502 503 504 /lua-error;

        location / {
            access_by_lua_file /usr/local/openresty/lualib/ipxa/ip_info_check.lua;
            root /usr/local/openresty/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        location = /lua-error {
            internal;
            content_by_lua_file /usr/local/openresty/lualib/ipxa/errors.lua;
        }
    }
}