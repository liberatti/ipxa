# Global Server Settings (Better in httpd.conf, but putting here for visibility)
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    # Remove Server Header (requires mod_headers)
    Header unset Server
    ServerName exemplo.com
    DocumentRoot /var/www/html
    
    # Log Format with Request ID
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" id=%{UNIQUE_ID}e" combined_id
    CustomLog /proc/self/fd/1 combined_id

    LuaHookAccessChecker /etc/httpd/lua/ipxa.lua ip_info_check
    
    # Error Handling
    ErrorDocument 400 /lua-error
    ErrorDocument 401 /lua-error
    ErrorDocument 403 /lua-error
    ErrorDocument 404 /lua-error
    ErrorDocument 405 /lua-error
    ErrorDocument 500 /lua-error
    ErrorDocument 502 /lua-error
    ErrorDocument 503 /lua-error
    ErrorDocument 504 /lua-error

    Alias /lua-error /etc/httpd/lua/errors.lua
    <Location /lua-error>
        LuaQuickHandler /etc/httpd/lua/errors.lua handle
    </Location>
</VirtualHost>