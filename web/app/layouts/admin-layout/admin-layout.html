<div class="admin-container">
  <mat-toolbar class="admin-header">
    <span class="brand-text"><img src="assets/logo.png" alt="ipxa Logo" class="brand-logo"> ipxa <small>Admin</small></span>
    <div class="nav-links">
      <a mat-button routerLink="/admin/feeds" routerLinkActive="active">
        <mat-icon>rss_feed</mat-icon>
        <span>Feeds</span>
      </a>
      <button mat-button (click)="openIpLookupDialog()" class="nav-btn ip-lookup-nav-btn">
        <mat-icon>search</mat-icon>
        <span>IP Lookup</span>
      </button>
    </div>
    <span class="spacer"></span>
    <button mat-button (click)="logout()" class="logout-btn">
      <mat-icon>logout</mat-icon> Logout
    </button>
  </mat-toolbar>

  <div class="admin-content">
    <div class="page-container animate-in">
      <router-outlet></router-outlet>
    </div>
    <footer class="admin-footer">
      <span>&copy; 2026 ipxa · Advanced IP Intelligence Dashboard</span>
      <div class="spacer"></div>
      <span class="footer-tag">Open Source</span>
    </footer>
  </div>
</div>

<ng-template #ipLookupDialog>
  <div class="ip-lookup-modal">
    <div class="ip-lookup-modal-header">
      <div class="modal-title-group">
        <mat-icon class="modal-header-icon">travel_explore</mat-icon>
        <div>
          <h3 class="modal-title">IP Intelligence Lookup</h3>
          <p class="modal-subtitle">Analyze reputation, geolocation, ASN, and risk score</p>
        </div>
      </div>
      <button mat-icon-button mat-dialog-close class="modal-close-btn" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="ip-lookup-modal-body">
      <app-ip-input (search)="onIpSearched()"></app-ip-input>
    </div>
  </div>
</ng-template>
