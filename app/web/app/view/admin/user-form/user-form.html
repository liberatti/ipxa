<h2 mat-dialog-title class="gradient-text">{{ data ? 'Edit User' : 'New User' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Ex: John Doe">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="john@example.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Invalid email address</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" placeholder="Password">
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let r of roles" [value]="r">{{r | titlecase}}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('role')?.hasError('required')">Role is required</mat-error>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Service Token</mat-label>
        <input matInput formControlName="service_token" placeholder="Generated service token">
        <button type="button" mat-icon-button matSuffix (click)="generateToken()">
          <mat-icon>vpn_key</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="onSave()">Save User</button>
</mat-dialog-actions>
