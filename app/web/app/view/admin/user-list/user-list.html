<div class="admin-view-header">
  <h2 class="gradient-text">Users Management</h2>
  <button mat-flat-button color="primary" (click)="openForm()">
    <mat-icon>add</mat-icon> Create User
  </button>
</div>

<mat-card class="glass-card">
  <div class="table-responsive">
    <table mat-table [dataSource]="userDS" class="admin-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let user"> {{user.name}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Role </th>
        <td mat-cell *matCellDef="let user"> 
          <span class="badge" [class]="user.role">{{user.role}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button color="primary" (click)="openForm(user)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="onRemove(user._id)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="userDC"></tr>
      <tr mat-row *matRowDef="let row; columns: userDC;"></tr>
    </table>
  </div>
  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" [pageSize]="userPA.per_page"
    [length]="userPA.total_elements" (page)="nextPage($event)"></mat-paginator>
</mat-card>
