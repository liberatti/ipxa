volumes:
  data:

services:
  app:
    build: .
    image: liberatti/ipxa:latest
    environment:
      - API_KEY=dev
      #      - SECURITY_ENABLED=false
      #      - IPINFO_TOKEN=
      #      - IBLOCKLIST_USERNAME=
      #      - IBLOCKLIST_PASSWORD=
      #      - MAXMIND_ACCOUNT_ID=
      #      - MAXMIND_LICENSE_KEY=
    volumes:
      - data:/data
      - ./hooks:/opt/ipxa/hooks
      - ./api:/opt/ipxa/api
      - ./config:/opt/ipxa/config
      - ./config.py:/opt/ipxa/config.py
      - ./main.py:/opt/ipxa/main.py
            
    ports:
      - "5000:5000"
    deploy:
      resources:
        limits:
          memory: 256M